name: Avatar lab client
on:
  pull_request:
    paths:
      - 'avatar/**'
      - 'avatar-test/**'
      - 'avatar-lab/**'
      - '.github/workflows/avatar-lab-client.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned platform
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          test -x "$manager"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile both Android modules and test real HTTPS client
        run: gradle -p avatar-lab :avatar-test:testDebugUnitTest --tests '*AvatarLabClientTest'
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-lab-client-tests
          path: avatar-test/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
